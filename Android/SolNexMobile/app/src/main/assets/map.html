<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        * { margin: 0; padding: 0; }
        html, body, #map { width: 100%; height: 100%; }
    </style>
</head>
<body>
    <div id="map"></div>
    <script>
        var map = L.map('map', {
            zoomControl: true,
            attributionControl: true
        }).setView([7.8731, 80.7718], 7);

        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '&copy; OpenStreetMap contributors'
        }).addTo(map);

        function addStations(stationsJson) {
            var stations = JSON.parse(stationsJson);
            var bounds = [];
            stations.forEach(function(station) {
                var color = station.status === 'Active' ? '#22c55e' : '#ef4444';
                var marker = L.circleMarker([station.latitude, station.longitude], {
                    radius: 10,
                    fillColor: color,
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.9
                }).addTo(map);
                marker.bindPopup(
                    '<div style="font-family:sans-serif;">' +
                    '<b style="font-size:14px;">' + station.stationName + '</b><br>' +
                    '<span style="color:#666;font-size:12px;">ID: ' + station.stationId + '</span><br>' +
                    '<span style="font-size:12px;">Capacity: ' + station.capacityKw + ' kW</span><br>' +
                    '<span style="color:' + color + ';font-weight:bold;font-size:12px;">' + station.status + '</span>' +
                    '</div>'
                );
                bounds.push([station.latitude, station.longitude]);
            });
            if (bounds.length > 0) {
                map.fitBounds(bounds, {padding: [50, 50], maxZoom: 13});
            }
        }
    </script>
</body>
</html>
